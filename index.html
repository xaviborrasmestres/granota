<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Granota Saltadora</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9fd6f5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  .hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);font-weight:800}
  .hud .big{font-size:42px;line-height:1}
  body.menu .badges{visibility:hidden}
  .hud .small{font-size:14px;opacity:.9;text-align:right}
  #snd{pointer-events:auto;position:fixed;top:68px;right:12px;width:46px;height:46px;padding:0;display:grid;place-items:center;border:2px solid rgba(255,255,255,.7);border-radius:50%;background:rgba(20,40,70,.55);box-shadow:0 3px 8px rgba(0,0,0,.3);cursor:pointer}
  #snd svg{width:26px;height:26px}
  #snd.off .on{display:none}
  #snd:not(.off) .off{display:none}
  .badges{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap;max-width:260px}
  .slots{display:flex;gap:3px;background:rgba(15,35,65,.5);padding:5px 7px;border-radius:18px;border:2px solid rgba(255,255,255,.35)}
  .slot{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;transition:transform .2s,background .2s}
  .slot svg{width:18px;height:18px;filter:grayscale(1) brightness(.55);opacity:.6}
  .slot.on{background:#fff;transform:scale(1.14)}
  .slot.on svg{filter:none;opacity:1}
  .slots.full{border-color:#fff;animation:glowb .8s ease-in-out infinite alternate}
  @keyframes glowb{from{box-shadow:0 0 6px #7fd1ff}to{box-shadow:0 0 20px #bfe9ff,0 0 6px #fff}}
  .dj{display:flex;align-items:center;gap:6px;background:rgba(15,35,65,.5);padding:5px 10px 5px 5px;border-radius:18px;border:2px solid rgba(255,255,255,.35);text-shadow:none}
  .dj .ic{width:30px;height:30px;border-radius:50%;background:linear-gradient(180deg,#8ee06a,#2fa84f);display:grid;place-items:center;opacity:.55}
  .dj .ic svg{width:20px;height:20px}
  .dj b{font-size:18px;min-width:14px;text-align:center}
  .pips{display:flex;gap:3px}
  .pips i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3)}
  .pips i.on{background:#ffd23a;box-shadow:0 0 7px #ffd23a}
  .dj.has{border-color:#b6ff8a;animation:glowg .8s ease-in-out infinite alternate}
  .dj.has .ic{opacity:1}
  @keyframes glowg{from{box-shadow:0 0 6px #7be04a}to{box-shadow:0 0 20px #b6ff8a}}
  .combo{display:flex;align-items:center;gap:4px;background:linear-gradient(180deg,#ff6b6b,#d62839);padding:3px 12px 3px 6px;border-radius:18px;border:2px solid #fff;font-weight:900;font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
  .combo svg{width:26px;height:26px}
  .combo.pop{animation:pop .35s}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
  svg{display:block}
  .tip .ic{width:54px;height:54px;border-radius:17px;margin:0 auto 5px;display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.22),0 3px 6px rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.6)}
  .tip .ic svg{width:38px;height:38px}
  .c1{background:linear-gradient(180deg,#ffb347,#f27d0c)}.c2{background:linear-gradient(180deg,#6fd8ff,#1f9ad6)}
  .c3{background:linear-gradient(180deg,#ff7b8a,#d62839)}.c4{background:linear-gradient(180deg,#8fb4ff,#3a5fd9)}
  .c5{background:linear-gradient(180deg,#8ee06a,#2fa84f)}.c6{background:linear-gradient(180deg,#c39bff,#7b4fd6)}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center;color:#fff}
  .card{background:rgba(20,50,40,.72);padding:22px 26px;border-radius:20px;max-width:340px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  .card h1{margin:0 0 8px;font-size:30px}
  .card p{margin:6px 0;font-size:16px;line-height:1.35}
  .card .cta{margin-top:14px;font-weight:800;font-size:18px;color:#ffe97a}
  .btn{pointer-events:auto;font:800 16px system-ui,sans-serif;padding:8px 14px;border-radius:14px;border:0;background:#ffe97a;color:#2b2b2b;cursor:pointer;margin:4px}
  .btn.alt{background:#fff;opacity:.9}
  .btn.small{font-size:14px;padding:6px 12px}
  .btn .ico,.card p .ico{width:18px;height:18px;display:inline-block;vertical-align:-3px;margin-right:6px}
  .btn .play{width:24px;height:24px;display:inline-block;vertical-align:-3px;margin-right:8px;color:#3a2300}
  .frogicon svg{width:76px;height:76px;margin:0 auto}
  .trophy{width:38px;height:38px;display:inline-block;vertical-align:-8px;margin-right:8px}
  #hofList .rk{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;font-size:18px;font-weight:900;flex:none;border:2px solid rgba(255,255,255,.7)}
  #hofList .rk.m1{background:radial-gradient(circle at 35% 30%,#fff3a6,#ffc200 60%,#c78800);color:#5a3a00}
  #hofList .rk.m2{background:radial-gradient(circle at 35% 30%,#ffffff,#c9d3e0 60%,#8e9bb0);color:#3a4558}
  #hofList .rk.m3{background:radial-gradient(circle at 35% 30%,#ffd9b0,#d98a45 60%,#9b5a22);color:#4a2a0c}
  #hofList .rk.mn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3)}
  .btn.big{display:block;width:100%;box-sizing:border-box;margin:12px 0 0;font-size:26px;padding:18px 20px;border-radius:22px;
    background:linear-gradient(180deg,#fff27a,#ffb300);color:#3a2300;letter-spacing:.5px;
    box-shadow:0 6px 0 #c77800,0 0 26px rgba(255,220,80,.85);animation:pulse 1s ease-in-out infinite}
  .btn.big:active{transform:translateY(4px);box-shadow:0 2px 0 #c77800,0 0 18px rgba(255,220,80,.8);animation:none}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  #nm{pointer-events:auto;font-size:16px;padding:8px 10px;border-radius:12px;border:0;text-align:center;width:150px;margin:4px}
  .menu{pointer-events:none;text-align:center;width:min(92vw,360px)}
  .frogicon{font-size:64px;line-height:1;animation:bob 1.4s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3))}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
  .logo{transform:rotate(-3deg);margin:2px 0 14px}
  .logo span{display:block;font-size:50px;font-weight:900;line-height:1;letter-spacing:2px;color:#a6f56b;-webkit-text-stroke:3px #1d5e2a;paint-order:stroke fill;text-shadow:0 5px 0 #1d5e2a,0 10px 18px rgba(0,0,0,.35)}
  .logo small{display:inline-block;margin-top:6px;font-size:18px;font-weight:800;letter-spacing:6px;color:#1d5e2a;background:#fff;padding:3px 12px 3px 18px;border-radius:20px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .tips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 6px}
  .tip{background:rgba(20,40,60,.62);border-radius:16px;padding:8px 4px 9px;box-shadow:0 3px 10px rgba(0,0,0,.2);backdrop-filter:blur(3px)}
  .tip b{display:block;font-size:15px;margin-top:2px}
  .tip span{display:block;font-size:11px;opacity:.8;line-height:1.15;margin-top:1px}
  .stats{display:flex;gap:10px;justify-content:center;margin:10px 0}
  .stats div{background:rgba(255,255,255,.12);border-radius:14px;padding:8px 20px}
  .stats small{display:block;font-size:11px;letter-spacing:1px;opacity:.75}
  .stats b{font-size:36px;line-height:1.1;color:#ffe97a}
  #hof{background:rgba(10,0,40,.62);backdrop-filter:blur(4px)}
  #hof .card{width:min(92vw,390px);max-width:none;box-sizing:border-box;padding:20px 16px 18px;background:linear-gradient(160deg,rgba(45,10,95,.96),rgba(125,20,120,.94));border:3px solid #ffd54a;box-shadow:0 0 34px rgba(255,200,60,.55)}
  #hof h1{font-size:36px;margin:0 0 6px;letter-spacing:1px;background:linear-gradient(180deg,#fff7b0,#ffb300);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
  #hofList{list-style:none;padding:0 2px;margin:8px 0 12px;text-align:left;max-height:58vh;overflow:auto}
  #hofList li{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:14px;margin:6px 0;background:rgba(255,255,255,.09);font-size:19px}
  #hofList li.r1{background:linear-gradient(90deg,rgba(255,213,74,.5),rgba(255,213,74,.12));font-size:24px;padding:11px 12px}
  #hofList li.r2{background:linear-gradient(90deg,rgba(210,222,240,.42),rgba(210,222,240,.1));font-size:22px;padding:10px 12px}
  #hofList li.r3{background:linear-gradient(90deg,rgba(205,127,50,.5),rgba(205,127,50,.1));font-size:21px}
  #hofList .nm{flex:1;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #hofList .d{display:block;font-size:11px;font-weight:400;opacity:.6}
  #hofList li b{font-size:1.35em;color:#ffe97a}
  #hofList li.me{outline:3px solid #fff;animation:meglow 1s ease-in-out infinite alternate}
  #hofList li.empty{display:block;text-align:center;background:none;opacity:.85}
  @keyframes meglow{from{box-shadow:0 0 6px #fff}to{box-shadow:0 0 22px #ffe97a}}
  .coins{display:flex;width:fit-content;margin:6px 0 0 auto;align-items:center;gap:5px;background:rgba(15,35,65,.5);border:2px solid rgba(255,255,255,.35);border-radius:16px;padding:3px 10px 3px 5px;text-shadow:none}
  .coins svg{width:24px;height:24px}
  .coins b{font-size:18px}
  .coins.pop{animation:pop .3s}
  #dailyTag{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#ffb347,#f27d0c);color:#fff;font-weight:900;font-size:12px;letter-spacing:1.5px;padding:4px 12px;border-radius:12px;border:2px solid #fff;pointer-events:none;text-shadow:0 1px 0 rgba(0,0,0,.3)}
  #snd{top:112px}
  .menurow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .mbtn{pointer-events:auto;cursor:pointer;border:0;border-radius:16px;padding:8px 4px 8px;background:rgba(255,255,255,.92);color:#2b2b3a;font-family:inherit;box-shadow:0 4px 0 rgba(0,0,0,.2),0 4px 10px rgba(0,0,0,.2)}
  .mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
  .mbtn svg{width:30px;height:30px;margin:0 auto 2px}
  .mbtn b{display:block;font-size:13px}
  .mbtn small{display:block;font-size:10.5px;opacity:.7;font-weight:700;margin-top:1px}
  .mbtn.done{opacity:.75}
  .row3{display:flex;gap:6px;justify-content:center;margin-top:8px;flex-wrap:wrap}
  .row3 .btn{margin:0}
  .earn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:14px;padding:4px 14px 4px 8px;margin:2px 0 6px}
  .earn svg,.bal svg{width:28px;height:28px}
  .earn b,.bal b{font-size:22px;color:#ffe97a}
  .bal{display:inline-flex;align-items:center;gap:6px;margin-bottom:8px}
  .shopcard{width:min(94vw,400px);max-width:none;box-sizing:border-box;padding:18px 14px 16px;background:linear-gradient(160deg,rgba(45,10,95,.96),rgba(125,20,120,.94));border:3px solid #ffd54a;box-shadow:0 0 34px rgba(255,200,60,.55)}
  .shopcard h1{font-size:32px;margin:0 0 4px;background:linear-gradient(180deg,#fff7b0,#ffb300);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
  .skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:56vh;overflow:auto;padding:2px}
  .skin{pointer-events:auto;cursor:pointer;background:rgba(255,255,255,.1);border:2px solid transparent;border-radius:14px;padding:6px 2px 8px;font-family:inherit;color:#fff;text-align:center}
  .skin canvas{width:76px;height:76px;display:block;margin:0 auto}
  .skin b{display:block;font-size:13px}
  .skin .st{display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:800;margin-top:3px;min-height:20px}
  .skin .st svg{width:16px;height:16px}
  .skin.locked canvas{filter:brightness(.55) saturate(.6)}
  .skin.sel{border-color:#7be04a;background:rgba(123,224,74,.2)}
  .skin.sel .st{color:#b6ff8a}
  .skin.nope{animation:shk .35s}
  .plist{display:flex;flex-direction:column;gap:8px;max-height:58vh;overflow:auto;padding:2px}
  .prow{pointer-events:auto;display:flex;align-items:center;gap:10px;text-align:left;background:rgba(255,255,255,.1);border:2px solid transparent;border-radius:14px;padding:8px 10px;color:#fff;font-family:inherit;width:100%;box-sizing:border-box}
  .prow .pic{flex:none;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.18);display:grid;place-items:center}
  .prow .pic svg{width:30px;height:30px}
  .prow .pt{flex:1;min-width:0}
  .prow .pt b{display:block;font-size:15px}
  .prow .pt span{display:block;font-size:11.5px;opacity:.8;font-weight:700}
  .prow .pr{flex:none;display:flex;align-items:center;gap:4px;font-weight:800;font-size:14px;min-width:54px;justify-content:flex-end}
  .prow .pr svg{width:20px;height:20px}
  .prow.sel{border-color:#7be04a;background:rgba(123,224,74,.2)}
  .prow.locked{opacity:.6}
  .prow.nope{animation:shk .35s}
  .prow.buy{cursor:pointer}
  .lvp{display:flex;gap:4px;margin-top:4px}
  .lvp i{width:18px;height:7px;border-radius:4px;background:rgba(255,255,255,.25)}
  .lvp i.on{background:#ffd54a}
  .bar{height:8px;border-radius:5px;background:rgba(255,255,255,.22);margin-top:5px;overflow:hidden}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#7be04a,#ffd54a)}
  .wprev{flex:none;width:44px;height:44px;border-radius:12px;border:2px solid rgba(255,255,255,.5)}
  @keyframes shk{20%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
  @media (max-height:700px){.frogicon svg{width:52px;height:52px}.logo span{font-size:40px}.tip .ic{width:42px;height:42px}.tip .ic svg{width:30px;height:30px}.btn.big{padding:12px 20px;font-size:22px}}
  .hidden{display:none}
</style>
</head>

  for (let i = pool.length - 1; i > 0; i--){ const j = Math.floor(rg()*(i+1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }

function surf(p, x){ return p.k ? p.top - p.k*(x - (p.x + p.w/2)) : p.top; }   // alçada de la superfície en x

// ---------- storage / sound ----------

$best.textContent = best;

function tone(f1, f2, dur, type='square', vol=.08){
  if(!soundOn) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(f2,20), t+dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
$snd.addEventListener('pointerdown', e => { e.stopPropagation(); soundOn = !soundOn; $snd.classList.toggle('off', !soundOn); });

// ---------- state ----------
let plats, frog, camX, state, score, charge, chargeT, baseY, particles, flakes, time = 0, deadAt = 0;
let shake = 0, slowT = 0, missMsg = '', skyP = 0;
let mode = 'normal', coins = 0, runCoins = 0;
try{ coins = +localStorage.getItem('granota_coins') || 0; }catch(e){}
function saveCoins(){ try{ localStorage.setItem('granota_coins', coins); }catch(e){} }
let RNG = Math.random;                                   // generador (amb llavor al repte diari)
const grnd = (a, b) => a + RNG()*(b - a);
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function dayKey(off){ const d = new Date(Date.now() - (off||0)*864e5); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }
function dailySeed(){ let h = 2166136261; for (const ch of dayKey()) h = Math.imul(h ^ ch.charCodeAt(0), 16777619); return h >>> 0; }
function loadDaily(){ try{ return JSON.parse(localStorage.getItem('granota_daily') || 'null'); }catch(e){ return null; } }
function saveDaily(sc){
  const prev = loadDaily();
  const streak = prev && prev.date === dayKey(1) ? (prev.streak || 0) + 1 : 1;

const FLY_N = 5, SLOPE_IDX = 14;

function noteHz(i){ return 330 * Math.pow(2, (SCALE[i % 5] + 12*Math.floor(i/5)) / 12); }
function burst(x, y, n){
  for (let i=0;i<n;i++) particles.push({ x, y, vx: rnd(-240,240), vy: rnd(-440,-80), life: rnd(.5,1), t: 0, c: 'hsl(' + rnd(0,360) + ',100%,65%)' });
}
// música de fons generativa (suau)
let musicTimer = null, mi = 4, mt = 0;
function musicTick(){

    tone(hz, hz, .4, 'triangle', .035);

}
const rnd = (a,b) => a + Math.random()*(b-a);

// ---- Garantia d'accessibilitat: simula el salt amb la mateixa física que el joc ----
function simJump(xs, ys, pw, t, zone){
  const h = 1/120;                       // mateix pas que el joc
  let vx = 140 + 380*pw, vy = -(330 + 270*pw), x = xs, y = ys;
  for (let i = 0; i < 480; i++){
    const py = y, px = x;
    vy += G*h;
    if (zone && x > zone.l && x < zone.r) vx += zone.a*h;      // vent
    x += vx*h; y += vy*h;
    const ty = t.k ? t.top - t.k*(x - t.cx) : t.top, tyPrev = t.k ? t.top - t.k*(px - t.cx) : t.top;
    if (vy > 0 && py <= tyPrev + 2 && y >= ty && x >= t.x - R*.4 && x <= t.x + t.w + R*.4) return { x, vx };
    const ledge = t.k ? t.top + t.k*t.w/2 : t.top;
    if (y > ledge + 3 && x + R > t.x && px + R <= t.x + 1 && x < t.x + t.w) return null;   // xoc amb la paret
    if (y > t.top + 400) return null;
  }
  return null;
}
function offsets(p){
  if (!p.mv) return [[0,0]];

  return p.mv.h ? [[0,0],[a,0],[-a,0]] : [[0,0],[0,a],[0,-a]];

function genPlat(prev, idx, safe){

  const diff = Math.min(idx, 30);
  const snowChance = idx < 3 ? 0 : Math.max(0, Math.min(.22 + idx*.01, .4) + world.snowAdd);
  const snow = !safe && RNG() < snowChance;
  const gap = safe ? grnd(60, 90) : grnd(60, Math.min(140 + diff*8, 320));
  let w = snow ? grnd(230, 360) : grnd(Math.max(70, 190 - diff*4), Math.max(110, 230 - diff*4));
  let top = prev.top + grnd(-85, 110);
  const minTop = baseY - 120, maxTop = baseY + 100;
  top = Math.max(minTop, Math.min(maxTop, top));
  if (prev.top - top > 80) top = prev.top - 80;     // límit de pujada
  if (safe) top = prev.top;
  const np = { x: prev.x + prev.w + gap, w, top, snow, idx, seed: RNG() };
  np.x0 = np.x; np.top0 = np.top;
  if (!safe && idx >= 5 && RNG() < Math.min(.12 + (idx - 5)*.02, .4)){

    np.mv = { h, amp: h ? grnd(12, 22) : grnd(14, 26), sp: grnd(.9, 1.5), ph: grnd(0, 6.28) };
  }
  np.gapL = prev.x + prev.w;
  if (!safe){
    // complicacions progressives
    if (!snow && !np.mv && idx >= world.crumbleFrom && RNG() < Math.min(.15 + (idx - world.crumbleFrom)*.015 + world.crumbleAdd, .42)){
      np.crumble = true; np.w = grnd(90, 150);                       // roca solta: cau 2 s després d'aterrar
    }
    if (!snow && !np.mv && !np.crumble && idx >= SLOPE_IDX && RNG() < Math.min(.15 + (idx - SLOPE_IDX)*.015, .3)){
      np.k = grnd(.06, .11); np.w = Math.max(np.w, grnd(150, 230));      // roca en pendent
    }
    if (idx >= world.windFrom && RNG() < Math.min(.2 + (idx - world.windFrom)*.015, .4)){
      np.wind = (RNG() < .5 ? -1 : 1) * grnd(80, 130 + Math.min((idx - world.windFrom)*5, 90));   // vent al buit
    }
  }
  if (gap > 90 && RNG() < .55){
    np.fly = { x: prev.x + prev.w + gap*grnd(.3,.7), y: Math.min(prev.top, top) - grnd(45,110), got: false, ph: RNG()*6 };
  }
  if (!np.fly && gap > 100 && RNG() < .6){
    np.coin = { x: prev.x + prev.w + gap*grnd(.25, .75), y: Math.min(prev.top, top) - grnd(35, 95), got: false, ph: RNG()*6 };
  }

}

      }
    }
    if (p.fallen){ p.fv += G*dt; p.dy += p.fv*dt; }
  }
  // penya-segats que es mouen una mica
  for (const p of plats){
    if (!p.mv) continue;
    const ox = p.x, m = p.mv, s = Math.sin(time*m.sp + m.ph)*m.amp;
    if (m.h) p.x = p.x0 + s; else p.top = p.top0 + s;
    if (frog.on === p && (state === 'idle' || state === 'charging')){ frog.x += p.x - ox; frog.y = p.top; }
  }
  if (state === 'rescue'){
    rs.t += dt / 1.0;
    const t = Math.min(rs.t, 1), e = t*t*(3 - 2*t), f = frog;
    const ex = rs.p.x + rs.p.w/2, ey = rs.p.top;
    f.x = rs.sx + (ex - rs.sx)*e;
    f.y = rs.sy + (ey - rs.sy)*e - Math.sin(Math.PI*t)*90;
    if (rs.t >= 1){
      f.x = ex; f.y = ey; f.on = rs.p; f.vx = 0; f.vy = 0; f.pend = null;
      state = 'idle'; dust(f.x, f.y, 6, '#b9a27a'); tone(160, 90, .1, 'triangle', .12);
      if (rs.p.crumble && !rs.p.cr) rs.p.cr = time;
      if (rs.p.idx > maxIdx){ maxIdx = rs.p.idx; score += 1; }
      hud();
      if (holding){ state = 'charging'; chargeT = 0; }
    }
    camX += (f.x - W*0.28 - camX) * Math.min(1, dt*4);
    ensurePlats();
    return;
  }
  if (state === 'charging'){
    chargeT += dt; charge = Math.min(chargeT / CHARGE_TIME, 1);
  }
  const f = frog;
  if (state === 'idle' && f.on){
    // lliscament sobre neu
    if (f.vx !== 0){
      const p = f.on;
      if (f.vx > 0) f.vx = Math.max(0, f.vx - SNOW_DECEL*dt);
      else f.vx = Math.min(0, f.vx + SLOPE_DECEL*dt);          // retrocedeix per la pendent
      f.x += f.vx*dt; f.y = surf(p, f.x);
      if (f.vx > 0 && Math.random() < .3) dust(f.x - 8, f.y, 1, '#fff');
      if (f.vx < 0 && Math.random() < .3) dust(f.x + 8, f.y, 1, '#b9a27a');
      if (f.x > p.x + p.w + R*0.6 || f.x < p.x - R*0.6){ f.on = null; state = 'air'; f.vy = 0; f.pend = null; }
      else if (f.vx === 0){
        judge(f);
        if (holding){ state = 'charging'; chargeT = 0; }
      }
    } else if (holding){ state = 'charging'; chargeT = 0; }
  }
  if (state === 'air' || state === 'dead'){
    const px = f.x, pyBottom = f.y;
    f.vy += G*dt;
    if (state === 'air' && !f.wall) f.vx += windAt(f.x)*dt;
    f.x += f.vx*dt; f.y += f.vy*dt;
    f.rot = Math.atan2(f.vy, Math.max(f.vx, 60)) * .6;
    if (state === 'air'){
      for (const p of plats){
        const fl = p.fly;
        if (fl && !fl.got && Math.hypot(f.x - fl.x, (f.y - 11) - fl.y) < 26 + 12*skillLv.magnet){
          fl.got = true; mProg('flies'); flies = Math.min(FLY_N, flies + 1); score += 1; hud(); vib(10);
          say(fl.x, fl.y - 14, flies >= FLY_N ? 'Escut preparat!' : '+1 mosca');
          tone(1000, 1500, .1, 'sine', .06);
        }
        const cn = p.coin;
        if (cn && !cn.got && Math.hypot(f.x - cn.x, (f.y - 11) - cn.y) < 26 + 12*skillLv.magnet){
          cn.got = true; mProg('coins'); coins++; runCoins++; saveCoins(); hud(); vib(8);
          say(cn.x, cn.y - 14, '+1'); tone(1300, 1900, .08, 'square', .05);
          $coinBox.classList.remove('pop'); void $coinBox.offsetWidth; $coinBox.classList.add('pop');
        }
        if (p.bird && !f.wall){
          const q = birdPos(p.bird);
          if (Math.hypot(f.x - q.x, (f.y - 11) - q.y) < 24){
            f.wall = true; f.vx = -90; f.vy = Math.max(f.vy, 150);
            say(f.x, f.y - 30, 'Au!'); tone(300, 100, .25, 'sawtooth', .09);
          }
        }
        if (p.fallen) continue;
        if (p.x > f.x + 200 || p.x + p.w < f.x - 200) continue;
        // aterratge
        const ty = surf(p, f.x), tyPrev = surf(p, px);
        if (f.vy > 0 && pyBottom <= tyPrev + 2 && f.y >= ty && f.x >= p.x - R*0.4 && f.x <= p.x + p.w + R*0.4){
          f.y = ty; f.on = p; f.vy = 0;
          f.vx = p.k ? -SLOPE_V : (p.snow ? f.vx * (SNOW_KEEP - .06*skillLv.grip) : 0);
          if (p.snow) mProg('ice');
          state = 'idle'; f.rot = 0;
          dust(f.x, f.y, p.snow ? 9 : 6, p.snow ? '#fff' : '#b9a27a');
          tone(160, 90, .1, 'triangle', .12);
          shake = Math.max(shake, 2); vib(12); f.missY = null;
          f.pend = null; f.wall = false;
          if (p.crumble && !p.cr) p.cr = time;
          if (p.idx > maxIdx){
            maxIdx = p.idx; score += 1; f.pend = p; hud();
            if (STAGES[maxIdx]) say(f.x + 80, 150, STAGES[maxIdx]);
            if (maxIdx % 10 === 0){ say(f.x, f.y - 110, maxIdx + ' roques!'); burst(f.x, f.y - 20, 26); tone(500, 1500, .4, 'sine', .08); vib([30, 40, 30]); }
            tone(700, 1000, .12,'sine',.06);
            if (!p.snow && !p.k) judge(f);
          }
          if (holding && f.vx === 0){ state = 'charging'; chargeT = 0; }
          break;
        }
        // xoc contra la paret del penya-segat
        const ledge = surf(p, p.x);
        if (f.y > ledge + 3 && f.x + R > p.x && px + R <= p.x + 1 && f.x < p.x + p.w){
          f.x = p.x - R; f.vx = -60;
          dust(f.x + R, f.y - 8, 6, '#b9a27a'); tone(120, 60, .15, 'sawtooth', .1);
          shake = 6; vib(40); if (f.missY == null) f.missY = f.y - ledge;
          state = 'air'; // continua caient
          f.wall = true;
        }
      }
      if (f.wall){ f.vx = Math.min(f.vx, 0); }
      if (f.y > H - 85 && flies >= FLY_N) startRescue();
      else {
        if (!f.splashed && f.y > H - 70){
          f.splashed = true;
          for (let i=0;i<14;i++) particles.push({ x: f.x, y: H - 70, vx: rnd(-120,120), vy: rnd(-380,-120), life: rnd(.4,.8), t: 0, c: '#bfe9ff' });
          tone(220, 60, .35, 'sine', .1);
          missMsg = '';
          if (f.missY != null && f.missY <= 70) missMsg = 'Per només ' + Math.max(1, Math.round(f.missY)) + ' px d\'alçada!';
          else {
            let md = 1e9;
            for (const q of plats){ if (q.fallen) continue; const dx = f.x < q.x ? q.x - f.x : (f.x > q.x + q.w ? f.x - (q.x + q.w) : 1e9); md = Math.min(md, dx); }
            if (md <= 70) missMsg = 'Per només ' + Math.max(1, Math.round(md)) + ' px!';
          }
        }
        if (f.y > H + 30) die();
      }
    }
  }
  // partícules
  for (const p of particles){ p.t += dt; p.vy += 600*dt; p.x += p.vx*dt; p.y += p.vy*dt; }
  particles = particles.filter(p => p.t < p.life);
  // càmera
  const target = f.x - W*0.28;
  camX += (target - camX) * Math.min(1, dt*4);
  ensurePlats();
}

const SKY = [

  [[132,118,190],[255,196,170]], [[124,196,240],[234,248,255]] ];
const NIGHT = [0, .25, 1, .35, 0], SUNLOW = [0, 1, 1.2, .7, 0];
function lerpC(a, b, t){ return [a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t, a[2] + (b[2]-a[2])*t]; }

function skyState(){
  const ph = ((skyP % 80) / 80) * 4, i = Math.min(3, Math.floor(ph)), t = ph - i, e = t*t*(3 - 2*t);
  let top = lerpC(SKY[i][0], SKY[i+1][0], e), bot = lerpC(SKY[i][1], SKY[i+1][1], e);
  if (world.tint){ top = lerpC(top, world.tint, world.mix); bot = lerpC(bot, world.tint, world.mix*.8); }
  return { top, bot,

}

  } else if (sk.acc === 'pirate'){

    c.beginPath(); c.moveTo(-12, -28); c.quadraticCurveTo(2, -37, 17, -29.500); c.lineTo(17, -25.500); c.lineTo(-12, -25); c.fill();
    c.beginPath(); c.moveTo(-12, -27); c.lineTo(-22, -24); c.lineTo(-17, -29); c.lineTo(-23, -31); c.lineTo(-12, -29.500); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(-4, -29, 1.200, 0, 7); c.arc(3, -31, 1.200, 0, 7); c.arc(10, -29.500, 1.200, 0, 7); c.fill();
    c.fillStyle = '#111'; c.beginPath(); c.arc(11, -20, 5.600, 0, 7); c.fill();
    c.strokeStyle = '#111'; c.lineWidth = 1.500; c.beginPath(); c.moveTo(6, -23); c.lineTo(-8, -25); c.stroke();
  } else if (sk.acc === 'crown'){
    c.fillStyle = '#ffc83d'; c.strokeStyle = '#b9770e'; c.lineWidth = 1.400; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(-1, -26.500); c.lineTo(-2, -37); c.lineTo(3, -32); c.lineTo(7, -39); c.lineTo(11, -32); c.lineTo(16, -37); c.lineTo(15, -26.500); c.closePath(); c.fill(); c.stroke();
    c.fillStyle = '#ff3b4e'; c.beginPath(); c.arc(7, -30, 1.800, 0, 7); c.fill();
  } else if (sk.acc === 'barretina'){
    c.fillStyle = '#d62839';
    c.beginPath(); c.moveTo(-3, -28); c.bezierCurveTo(-2, -44, -24, -48, -28, -32); c.bezierCurveTo(-30, -24, -24, -20, -18, -24);
    c.bezierCurveTo(-12, -28, -8, -26, 16, -26.500); c.lineTo(16, -28.500); c.closePath(); c.fill();
    c.fillStyle = '#9d1523'; c.beginPath(); c.moveTo(-6, -34); c.bezierCurveTo(-14, -40, -22, -38, -25, -31); c.bezierCurveTo(-18, -34, -12, -33, -6, -30); c.fill();
    c.fillStyle = '#2a2a35'; c.beginPath(); c.roundRect ? c.roundRect(-4, -30.500, 21, 5, 2) : c.rect(-4, -30.500, 21, 5); c.fill();
  }
  if (sk.gold){
    for (let i=0;i<3;i++){
      const tw = .5 + .5*Math.sin((t||0)*5 + i*2.1), px = [-14, 14, 4][i], py = [-24, -20, -34][i], r = 1 + 2.500*tw;
      c.fillStyle = 'rgba(255,255,255,' + (.35 + .6*tw) + ')';
      c.fillRect(px - r, py - .8, r*2, 1.600); c.fillRect(px - .8, py - r, 1.600, r*2);
    }
  }
}
const GREEN = { leg: '#2f8f3a', leg2: '#257a30', c1: '#7be063', c2: '#38a63f', belly: '#c9f3b0', spot: 'rgba(30,110,40,.45)' };
const SKINS = [
  { id: 'verda', name: 'Verda', cost: 0, ...GREEN },
  { id: 'blava', name: 'Blava', cost: 25, leg: '#2468b0', leg2: '#1d5694', c1: '#8fdcff', c2: '#2a7fd1', belly: '#e1f4ff', spot: 'rgba(20,70,140,.4)', mouth: '#12427a' },
  { id: 'rosa', name: 'Rosa', cost: 25, leg: '#c13d82', leg2: '#a22f6b', c1: '#ffb3d6', c2: '#e0509a', belly: '#ffe5f2', spot: 'rgba(150,30,90,.4)', mouth: '#7a1c4b' },
  { id: 'ninja', name: 'Ninja', cost: 50, leg: '#1b1b25', leg2: '#14141c', c1: '#6a6a82', c2: '#262633', belly: '#7b7b95', spot: 'rgba(0,0,0,.35)', mouth: '#0d0d14', acc: 'ninja' },
  { id: 'barretina', name: 'Barretina', cost: 60, ...GREEN, acc: 'barretina' },
  { id: 'pirata', name: 'Pirata', cost: 75, leg: '#b8631a', leg2: '#97500f', c1: '#ffc27a', c2: '#e0842a', belly: '#ffe9c9', spot: 'rgba(130,60,10,.4)', mouth: '#6b3208', acc: 'pirate' },
  { id: 'rei', name: 'Rei', cost: 100, ...GREEN, acc: 'crown' },
  { id: 'daurada', name: 'Daurada', cost: 150, leg: '#c98a00', leg2: '#a87000', c1: '#fff3a8', c2: '#e0a000', belly: '#fff9d6', spot: 'rgba(160,100,0,.35)', mouth: '#7a5000', gold: true }
];
let skinState = { owned: ['verda'], sel: 'verda' };
try{
  const ss = JSON.parse(localStorage.getItem('granota_skins') || 'null');
  if (ss && Array.isArray(ss.owned) && SKINS.some(k => k.id === ss.sel)) skinState = { owned: ss.owned.filter(id => SKINS.some(k => k.id === id)), sel: ss.sel };
  if (!skinState.owned.includes('verda')) skinState.owned.push('verda');
}catch(e){}
function saveSkins(){ try{ localStorage.setItem('granota_skins', JSON.stringify(skinState)); }catch(e){} }
function curSkin(){ return SKINS.find(k => k.id === skinState.sel) || SKINS[0]; }
function drawFrog(){
  const f = frog, sx = f.x - camX, sy = f.y;
  const sq = state === 'charging' ? charge : 0;
  if (f.on && (state === 'idle' || state === 'charging')){
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(sx, sy + 1, 14 + sq*4, 3.5, 0, 0, 7); ctx.fill();
  }
  ctx.save();
  ctx.translate(sx, sy);
  if (state === 'air' || state === 'dead') ctx.rotate(f.rot);
  else if (f.on && f.on.k) ctx.rotate(-Math.atan(f.on.k));
  const breathe = (state === 'idle' ? Math.sin(time*3)*.025 : 0);
  ctx.scale(1 + sq*.25, 1 - sq*.35 + breathe);
  paintFrog(ctx, curSkin(), (time % 3.4) < .12, time);
  ctx.restore();
  if (state === 'rescue'){
    for (let i=0;i<3;i++){
      const a = time*7 + i*2.094;
      drawFly(sx + Math.cos(a)*24, sy - 38 + Math.sin(a)*8, 1.1);
    }
  }
}
function drawCoin(x, y, ph){
  const w = Math.abs(Math.cos(time*4 + ph));
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(255,220,80,.3)'; ctx.beginPath(); ctx.arc(0, 0, 15, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffc83d'; ctx.strokeStyle = '#b9770e'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, 0, Math.max(2, 9*w), 9, 0, 0, 7); ctx.fill(); ctx.stroke();
  if (w > .45){ ctx.strokeStyle = '#e09a14'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.ellipse(0, 0, Math.max(1, 5.5*w), 5.5, 0, 0, 7); ctx.stroke(); }
  ctx.restore();
}
function drawFly(x, y, s=1){
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(255,240,120,.35)'; ctx.beginPath(); ctx.arc(0,0,13,0,7); ctx.fill();
  const a = Math.sin(time*45)*.5;
  ctx.fillStyle = 'rgba(255,255,255,.85)';
  ctx.beginPath(); ctx.ellipse(-2,-4,5,2.2,-.6+a,0,7); ctx.ellipse(3,-4,5,2.2,.6-a,0,7); ctx.fill();
  ctx.fillStyle = '#222'; ctx.beginPath(); ctx.ellipse(0,0,4.5,3.2,0,0,7); ctx.fill();
  ctx.fillStyle = '#d33'; ctx.beginPath(); ctx.arc(3.5,-1,1.3,0,7); ctx.fill();
  ctx.restore();
}
function drawTexts(){
  ctx.textAlign = 'center'; ctx.font = '800 20px system-ui, sans-serif'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(0,0,0,.45)';
  for (const t of texts){
    ctx.globalAlpha = Math.max(0, 1 - t.t/1.3);
    ctx.strokeText(t.s, t.x - camX, t.y); ctx.fillStyle = '#fff6a8'; ctx.fillText(t.s, t.x - camX, t.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'start';
}
function drawBird(x, y){
  const a = Math.sin(time*14)*9;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = '#2b2b3a';
  ctx.beginPath(); ctx.ellipse(0, 0, 13, 7, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-4, -2); ctx.lineTo(-14, -14 - a); ctx.lineTo(4, -3); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-2, 2); ctx.lineTo(-12, 12 + a); ctx.lineTo(5, 3); ctx.fill();
  ctx.fillStyle = '#f2a31b'; ctx.beginPath(); ctx.moveTo(12, -1); ctx.lineTo(20, 1); ctx.lineTo(12, 3); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(8, -2, 2, 0, 7); ctx.fill();
  ctx.restore();
}
function drawWind(p){
  const l = p.gapL - camX, r = p.x0 - camX, len = r - l;
  if (r < 0 || l > W || len <= 0) return;
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  const d = Math.sign(p.wind);
  for (let i = 0; i < 7; i++){
    const yy = H*0.2 + i*H*0.07 + (i%2)*10;
    const xx = l + ((((time*p.wind*.9 + i*61) % len) + len) % len);
    ctx.beginPath(); ctx.moveTo(xx, yy); ctx.lineTo(xx + d*34, yy); ctx.stroke();
  }
  ctx.lineCap = 'butt';
  // fletxes animades que indiquen la direcció
  const cx = l + len/2, cy = H*0.16;
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let k=0;k<3;k++){
    const ox = (k - 1)*18*d;
    ctx.globalAlpha = .35 + .65*((Math.sin(time*6 - k*d*1.3) + 1)/2);
    ctx.beginPath(); ctx.moveTo(cx + ox - 7*d, cy - 12); ctx.lineTo(cx + ox + 7*d, cy); ctx.lineTo(cx + ox - 7*d, cy + 12); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.lineCap = 'butt';
}
function drawWater(){
  const lvl = H - 70;
  const g = ctx.createLinearGradient(0, lvl, 0, H);
  g.addColorStop(0, world.water[0]); g.addColorStop(1, world.water[1]);
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x=0; x<=W+20; x+=20)
    ctx.lineTo(x, lvl + Math.sin((x + camX)*.03 + time*2)*4 + Math.sin((x + camX)*.07 - time*1.5)*2);
  ctx.lineTo(W, H); ctx.closePath();
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x=0; x<=W+20; x+=20){
    const y = lvl + Math.sin((x + camX)*.03 + time*2)*4 + Math.sin((x + camX)*.07 - time*1.5)*2;
    if (x) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  }
  ctx.stroke();
}
function drawFireflies(S){
  if (S.night < .35) return;
  for (let i=0;i<14;i++){
    const x = ((((i*211 + Math.sin(time*.5 + i)*30 - camX*.5) % W) + W) % W);
    const y = H*0.35 + ((i*83) % (H*0.35)) + Math.sin(time*1.3 + i*2)*12;
    const a = S.night*(.5 + .5*Math.sin(time*4 + i));
    ctx.fillStyle = 'rgba(255,240,120,' + (a*.35) + ')'; ctx.beginPath(); ctx.arc(x, y, 7, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,200,' + a + ')'; ctx.beginPath(); ctx.arc(x, y, 2, 0, 7); ctx.fill();
  }
}
function drawPower(){
  if (state !== 'charging') return;
  const bw = 160, bh = 12, x = (W - bw)/2, y = H - 60;
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(x-3, y-3, bw+6, bh+6);
  const g = ctx.createLinearGradient(x,0,x+bw,0);
  g.addColorStop(0,'#7be04a'); g.addColorStop(.6,'#f5d63a'); g.addColorStop(1,'#ef4a3a');
  ctx.fillStyle = g; ctx.fillRect(x, y, bw*charge, bh);
}
function draw(){
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
  if (shake > .3) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
  drawBg();
  for (const p of plats){
    const sx = p.x - camX;
    if (sx > W + 20 || sx + p.w < -20) continue;
    drawPlat(p);
  }
  for (const p of plats){
    if (p.wind) drawWind(p);
    if (p.bird){ const q = birdPos(p.bird); drawBird(q.x - camX, q.y); }
  }
  for (const p of plats){
    if (p.coin && !p.coin.got && p.coin.x - camX > -30 && p.coin.x - camX < W + 30) drawCoin(p.coin.x - camX, p.coin.y + Math.sin(time*3 + p.coin.ph)*4, p.coin.ph);
    const fl = p.fly;
    if (fl && !fl.got && fl.x - camX > -30 && fl.x - camX < W + 30)
      drawFly(fl.x - camX, fl.y + Math.sin(time*3 + fl.ph)*5);
  }
  for (const p of particles){
    ctx.globalAlpha = 1 - p.t/p.life; ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x - camX, p.y, 3, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawFrog();
  drawWater();
  // neu que cau
  ctx.fillStyle = 'rgba(255,255,255,.8)';
  for (const s of flakes){
    s.y += s.v*0.016; if (s.y > 1){ s.y = 0; s.x = Math.random(); }
    ctx.beginPath(); ctx.arc(s.x*W + Math.sin(time*2 + s.x*20)*6, s.y*H, s.s*.6, 0, 7); ctx.fill();
  }
  const S = skyState();
  drawFireflies(S);
  if (S.night > .02){ ctx.fillStyle = 'rgba(8,12,45,' + (S.night*.3) + ')'; ctx.fillRect(0, 0, W, H); }
  const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*.45, W/2, H/2, Math.max(W,H)*.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,30,60,.28)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  drawTexts();
  drawPower();
}

// ---------- loop ----------
let last = performance.now(), acc = 0;
function frame(now){
  let d = Math.min((now - last)/1000, .1); last = now;
  if (slowT > 0){ slowT -= d; d *= .4; }
  if (state !== 'ready'){
    acc += d;
    const h = 1/120;
    while (acc >= h){ step(h); acc -= h; }
  } else { time += d; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
